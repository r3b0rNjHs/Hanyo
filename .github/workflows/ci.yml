name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # apt mirrors on the runner fail now and then; the runner image already has most of
      # Chromium's libraries, so fall back to installing only the browser.
      - run: npx playwright install --with-deps chromium || npx playwright install chromium
        working-directory: apps/web
      - run: npm run e2e --workspace=apps/web
