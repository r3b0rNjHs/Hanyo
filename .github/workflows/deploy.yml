name: Deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "*.md"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Skipped until the VPS secrets exist in this repo (see docs/deploy.md).
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: bash ~/hanyo/deploy/deploy.sh

      - name: Health check
        run: |
          for i in 1 2 3; do
            sleep 8
            code=$(curl -s -o /dev/null -w '%{http_code}' https://hanyo.yoqze.com/api/health || true)
            [ "$code" = "200" ] && echo "healthy" && exit 0
            echo "attempt $i: $code"
          done
          exit 1
